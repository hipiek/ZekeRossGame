name: Build Android APK & Release

# Build a sideloadable APK and attach it to a GitHub Release.
#  - Push a tag like v1.0.0  -> builds the APK and publishes a Release.
#  - Run manually (workflow_dispatch) -> builds the APK as a downloadable
#    workflow artifact (no Release created).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the APK filename (manual builds)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Apply branded launcher icons
        run: cp -R resources/android-res/. android/app/src/main/res/

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK with versioned name
        id: stage
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/SnapSquad-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapSquad-${{ steps.stage.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SNAP SQUAD ${{ steps.stage.outputs.version }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## 📱 SNAP SQUAD: Clout Empire — ${{ steps.stage.outputs.version }}

            Download **`SnapSquad-${{ steps.stage.outputs.version }}.apk`** below and install it on your Android phone.

            ### Install
            1. Download the `.apk` to your phone.
            2. Open it. If prompted, allow **"Install unknown apps"** for your browser/file manager.
            3. Tap **Install**, then launch **SNAP SQUAD** from your app drawer.

            > This is a debug-signed build for easy sideloading. Android may show an
            > "unknown developer" warning — that's expected for apps installed outside
            > the Play Store.
